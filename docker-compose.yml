services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aeterna
      POSTGRES_USER: aeterna
      POSTGRES_PASSWORD: aeterna
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeterna"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://aeterna:aeterna@postgres:5432/aeterna
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  alert-simulator:
    build: ./alert-simulator
    env_file: ./alert-simulator/.env
    environment:
      AETERNA_CORE_URL: http://backend:8000
    ports:
      - "8050:8050"
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_WS_URL: ws://localhost:8000
        VITE_AETERNA_API_KEY: cummins-demo-key
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
