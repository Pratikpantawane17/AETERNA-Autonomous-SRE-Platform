apiVersion: apps/v1
kind: Deployment
metadata:
  name: aeterna-sample-app
  namespace: aeterna-sample
  labels:
    app: aeterna-sample-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aeterna-sample-app
  template:
    metadata:
      labels:
        app: aeterna-sample-app
    spec:
      containers:
      - name: sample-app
        image: aeterna-sample-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: ERROR_RATE
          value: "0.0"
        - name: SLOW_MODE
          value: "false"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /api/live
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /api/ready
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 5
